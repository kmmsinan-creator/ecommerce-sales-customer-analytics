<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>E-Commerce Sales &amp; Customer Intelligence</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>E-Commerce Sales &amp; Customer Intelligence Analytics</h1>
  <p class="ask">Where does revenue come from, who keeps buying, and what leaks away?</p>
  <p id="sub">Loading data…</p>
  <nav>
    <button data-t="overview" class="on">Overview</button>
    <button data-t="customers">Customers</button>
    <button data-t="products">Products</button>
    <button data-t="markets">Markets</button>
    <button data-t="quality">Cancellations &amp; data quality</button>
  </nav>
</header>
<main>
  <section id="overview"><div class="kpis"></div><div class="grid"></div></section>
  <section id="customers" hidden><div class="grid"></div></section>
  <section id="products" hidden><div class="grid"></div></section>
  <section id="markets" hidden><div class="grid"></div></section>
  <section id="quality" hidden><div class="grid"></div></section>
</main>
<footer id="foot"></footer>
<script>
function load(u, ok, bad) {
  var s = document.createElement('script');
  s.src = u; s.onload = ok; s.onerror = bad;
  document.head.appendChild(s);
}
function start() { load('js/app.js', null, function () { document.getElementById('sub').textContent = 'Could not load js/app.js. Check that it is in docs/js/.'; }); }
load('https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js', start, function () {
  load('https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js', start, function () {
    document.getElementById('sub').textContent = 'Could not load the chart library from either CDN. Check your connection or disable the ad blocker for this site.';
  });
});
</script>
</body>
</html>
